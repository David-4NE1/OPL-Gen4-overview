name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig; laufende Deploys nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: schaltet Pages per API auf "GitHub Actions", falls noch
      # nicht konfiguriert – sonst scheitert der Run mit "Get Pages site failed".
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Kein Build-Step: die Seite ist statisch, das Repo-Root ist das Artefakt.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
