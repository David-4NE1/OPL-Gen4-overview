name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Secret fehlt – Deploy uebersprungen
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN ist nicht als Repository-Secret hinterlegt – Deploy uebersprungen."

      - name: Token und Account-ID pruefen
        if: env.HAS_TOKEN == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ "$CF_TOKEN" != "$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')" ] && echo "::warning::CLOUDFLARE_API_TOKEN enthaelt Leerzeichen oder Zeilenumbrueche"
          [ "$CF_ACCOUNT" != "$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')" ] && echo "::warning::CLOUDFLARE_ACCOUNT_ID enthaelt Leerzeichen oder Zeilenumbrueche"
          echo "Laenge Account-ID: ${#CF_ACCOUNT} (erwartet: 32)"
          status=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.status // "ungueltig"')
          echo "Token-Status: $status"
          ids=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[]?.id')
          echo "Konten, auf die der Token Zugriff hat: $(printf '%s\n' "$ids" | grep -c .)"
          if printf '%s\n' "$ids" | grep -qx "$CF_ACCOUNT"; then
            echo "Account-ID passt zum Token"
          else
            echo "::warning::Account-ID gehoert nicht zu den Konten dieses Tokens"
          fi

      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_TOKEN == 'true'
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
