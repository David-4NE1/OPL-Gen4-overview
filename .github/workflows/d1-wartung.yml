name: D1 Wartung (Diagnose / Time Travel)

# Manuell starten: Actions -> "D1 Wartung" -> Run workflow.
# diagnose: zeigt Kartenanzahl, Nummern und Import-/Loesch-Ereignisse (keine Karteninhalte).
# restore:  setzt die Datenbank per D1 Time Travel auf den angegebenen Zeitpunkt zurueck.
#           Die Ausgabe enthaelt das Lesezeichen des vorherigen Stands (zum Rueckgaengigmachen).
# bilder-diagnose: listet doppelte Bilder je Karte (Nr, Position, Dateiname, Groesse).
# bilder-duplikate-entfernen: entfernt diese Duplikate (vorher/nachher-Liste, Eintrag im Protokoll).
# themen-umstellen: ordnet die Karten #1 bis #132 den festen Themen und Baugruppen zu
#           (.github/d1/themen-umstellen.sql); gibt nur Zaehlungen aus, keine Karteninhalte.
#           Rueckgaengig per restore auf den Zeitpunkt vor dem Lauf.
# verantwortlichkeit-standard: fuellt leere Verantwortlichkeiten nach Person (.github/d1/verantwortlichkeit-standard.sql).
# owner-stand: zaehlt Punkte ohne Owner bzw. Termin (.github/d1/owner-stand.sql), nur Zaehlungen.

on:
  workflow_dispatch:
    inputs:
      aktion:
        description: 'diagnose oder restore'
        required: true
        default: diagnose
        type: choice
        options: [diagnose, restore, bilder-diagnose, bilder-duplikate-entfernen, themen-umstellen, verantwortlichkeit-standard, owner-stand]
      zeitpunkt:
        description: 'Nur fuer restore: Zeitpunkt in UTC (RFC3339), z. B. 2026-10-02T08:35:00Z'
        required: false
        default: ''

concurrency:
  group: d1-wartung
  cancel-in-progress: false

jobs:
  d1:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZEITPUNKT: ${{ inputs.zeitpunkt }}
    steps:
      - uses: actions/checkout@v4

      - name: Wrangler installieren
        run: npm i -g wrangler@4

      - name: Stand vorher
        run: |
          wrangler d1 time-travel info opl-gen4
          wrangler d1 execute opl-gen4 --remote --command "SELECT COUNT(*) AS anzahl, MIN(nr) AS min_nr, MAX(nr) AS max_nr, SUM(LENGTH(bilder)) AS bilder_bytes_gesamt, MAX(LENGTH(bilder)) AS bilder_bytes_max_karte FROM entries"
          wrangler d1 execute opl-gen4 --remote --command "SELECT group_concat(nr, ',') AS nummern FROM (SELECT nr FROM entries ORDER BY nr)"
          wrangler d1 execute opl-gen4 --remote --command "SELECT id, nr, substr(text, 1, 80) AS ereignis, wann, wer FROM changelog WHERE wann >= datetime('now', '-3 days') AND (text LIKE 'Excel-Import%' OR text = 'gelöscht' OR text = 'angelegt') ORDER BY id DESC LIMIT 80"
          wrangler d1 execute opl-gen4 --remote --command "SELECT substr(wann, 1, 13) AS stunde_utc, COUNT(*) AS aenderungen FROM changelog WHERE wann >= datetime('now', '-2 days') GROUP BY 1 ORDER BY 1 DESC"

      # Kommentarzeilen entfernen: ein fuehrendes "--" haelt wrangler sonst fuer eine Option
      - name: Doppelte Bilder (Diagnose)
        if: startsWith(inputs.aktion, 'bilder-')
        run: wrangler d1 execute opl-gen4 --remote --command "$(grep -v '^--' .github/d1/bilder-diagnose.sql)"

      - name: Doppelte Bilder entfernen
        if: inputs.aktion == 'bilder-duplikate-entfernen'
        run: |
          wrangler d1 execute opl-gen4 --remote --command "$(grep -v '^--' .github/d1/bilder-duplikate-entfernen.sql)"
          echo "Nachher (sollte leer sein):"
          wrangler d1 execute opl-gen4 --remote --command "$(grep -v '^--' .github/d1/bilder-diagnose.sql)"
          wrangler d1 execute opl-gen4 --remote --command "SELECT COUNT(*) AS anzahl, SUM(LENGTH(bilder)) AS bilder_bytes_gesamt FROM entries"

      - name: Themen und Baugruppen umstellen
        if: inputs.aktion == 'themen-umstellen'
        run: |
          wrangler d1 execute opl-gen4 --remote --command "SELECT 1 FROM pragma_table_info('entries') WHERE name = 'baugruppe'" | grep -q '"1"' || \
            wrangler d1 execute opl-gen4 --remote --command "ALTER TABLE entries ADD COLUMN baugruppe TEXT DEFAULT ''"
          wrangler d1 execute opl-gen4 --remote --command "$(grep -v '^--' .github/d1/themen-umstellen.sql)"
          wrangler d1 execute opl-gen4 --remote --command "SELECT thema, COUNT(*) AS anzahl FROM entries GROUP BY thema ORDER BY anzahl DESC"
          wrangler d1 execute opl-gen4 --remote --command "SELECT baugruppe, COUNT(*) AS anzahl FROM entries GROUP BY baugruppe ORDER BY anzahl DESC"

      - name: Verantwortlichkeit nach Person nachtragen
        if: inputs.aktion == 'verantwortlichkeit-standard'
        run: |
          wrangler d1 execute opl-gen4 --remote --command "$(grep -v '^--' .github/d1/verantwortlichkeit-standard.sql)"
          wrangler d1 execute opl-gen4 --remote --command "SELECT verantwortlichkeit, COUNT(*) AS anzahl FROM entries GROUP BY verantwortlichkeit ORDER BY anzahl DESC"

      - name: Stand Owner und Termine
        if: inputs.aktion == 'owner-stand'
        run: wrangler d1 execute opl-gen4 --remote --command "$(grep -v '^--' .github/d1/owner-stand.sql)"

      - name: Time Travel Restore
        if: inputs.aktion == 'restore'
        run: |
          if ! printf '%s' "$ZEITPUNKT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?Z$'; then
            echo "::error::Ungueltiger Zeitpunkt '$ZEITPUNKT' (erwartet z. B. 2026-10-02T08:35:00Z)"; exit 1
          fi
          wrangler d1 time-travel restore opl-gen4 --timestamp="$ZEITPUNKT"

      - name: Stand nachher
        if: inputs.aktion == 'restore'
        run: |
          wrangler d1 execute opl-gen4 --remote --command "SELECT COUNT(*) AS anzahl, MIN(nr) AS min_nr, MAX(nr) AS max_nr FROM entries"
          wrangler d1 execute opl-gen4 --remote --command "SELECT group_concat(nr, ',') AS nummern FROM (SELECT nr FROM entries ORDER BY nr)"
