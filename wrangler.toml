# Cloudflare Worker + Static Assets
#
# serve_directly = false: ALLE Requests laufen durch den Worker,
# damit die Passwort-Pruefung greift. Der Worker reicht statische
# Dateien nach Auth-Check ueber env.ASSETS.fetch() weiter.

name = "opl-gen4-overview"
main = "worker/index.js"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
serve_directly = false

[[d1_databases]]
binding = "DB"
database_name = "opl-gen4"
database_id = "71f6b523-36a9-4483-9f33-7df365cbe4ce"
