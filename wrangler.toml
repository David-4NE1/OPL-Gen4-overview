# Cloudflare Worker + Static Assets
#
# Statische Dateien werden vom CDN ausgeliefert.
# Der Worker handelt /api/*-Routen (D1 + Auth).
# Passwortschutz: Frontend prueft Auth via /api/auth,
# alle Daten-Endpunkte erfordern Session-Cookie.

name = "opl-gen4-overview"
main = "worker/index.js"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "opl-gen4"
database_id = "71f6b523-36a9-4483-9f33-7df365cbe4ce"
